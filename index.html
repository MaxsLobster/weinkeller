<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weinkeller</title>
<meta name="theme-color" content="#F7F3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weinkeller">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="schule-data.js"></script>
<script src="app.js"></script>
<script>
  // Offline-Cache + automatische Updates: beim Öffnen und beim Zurückholen aus dem Hintergrund nach
  // einer neuen Version schauen. Ist sie da, neu laden – sofort, wenn die App gerade erst geöffnet wurde,
  // sonst beim nächsten Wechsel in den Hintergrund (damit nichts Getipptes verloren geht).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try {
      var hadCtrl = !!navigator.serviceWorker.controller, freshAt = Date.now(), pending = false, reg = null;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { reg = r; }).catch(function () {});
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadCtrl) { hadCtrl = true; return; }
        if (Date.now() - freshAt < 8000) location.reload(); else pending = true;
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') { if (pending) location.reload(); return; }
        freshAt = Date.now();
        if (reg) reg.update().catch(function () {});
      });
    } catch (e) {}
  }
</script>
</body>
</html>
